<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(35)"><path d="M0 0V10" stroke="#b4b6a7" stroke-width="1"/></pattern><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#9b663a" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="1000" fill="#ece8dc" stroke="none" stroke-width="2"/><text x="58" y="43" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2">DWELLING ON THE HILL / MİMARİ TASARIM ÖNERİSİ</text><text x="58" y="94" fill="#303c36" font-family="Segoe UI,Arial,sans-serif" font-size="35" >D03  02 · Su haznesi</text><text x="58" y="130" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="18" >Plan + A–A yan kesiti. Havuzun çevresinden yürüyerek yüksek çıkışa ulaşılmaz.</text><path d="M58 153L1542 153" fill="none" stroke="#303c36" stroke-width="2" /><path d="M58 940L1542 940" fill="none" stroke="#303c36" stroke-width="2" /><text x="58" y="972" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="14" >21 EKİM 2026 · Ölçüler tasarım önerisi; arazi, kazı veya Unreal uygulaması ölçümü değildir.</text><text x="1542" y="972" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="14" text-anchor="end">D03</text><rect x="224" y="208" width="416" height="272" fill="url(#hatch)" stroke="#303c36" stroke-width="2"/><rect x="240" y="224" width="384" height="240" fill="#a0c8cb" stroke="#303c36" stroke-width="3"/><rect x="142" y="300.8" width="98" height="86.4" fill="#ece8dc" stroke="#303c36" stroke-width="2"/><rect x="624" y="300.8" width="90" height="86.4" fill="#ece8dc" stroke="#303c36" stroke-width="2"/><polyline points="90,344 759,344" fill="none" stroke="#9b663a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr)"/><polyline points="140,254 250,254" fill="none" stroke="#386b78" stroke-width="12" stroke-linejoin="round" /><text x="90" y="184" fill="#303c36" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Giriş / kontrol</text><text x="584" y="184" fill="#303c36" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Karşı çıkış</text><path d="M240 499L624 499" fill="none" stroke-width="2" stroke="#626d60"/><path d="M240 493L240 505" fill="none" stroke="#303c36" stroke-width="2" /><path d="M624 493L624 505" fill="none" stroke="#303c36" stroke-width="2" /><text x="432" y="489" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle">8 m</text><path d="M749 224L749 464" fill="none" stroke-width="2" stroke="#626d60"/><path d="M755 224L743 224" fill="none" stroke="#303c36" stroke-width="2" /><path d="M755 464L743 464" fill="none" stroke="#303c36" stroke-width="2" /><text x="766" y="344" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="16" text-anchor="start">5 m</text><text x="930" y="235" fill="#303c36" font-family="Segoe UI,Arial,sans-serif" font-size="22" >PLAN / tek hazne</text><text x="930" y="267" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Kuru giriş −5,3 m.</text><text x="930" y="294" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Karşı eşik −5,4 m.</text><text x="930" y="321" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Üstten besleme, alttan tahliye.</text><text x="930" y="348" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Yan duvarlarda yürüyüş rafı yok.</text><text x="930" y="420" fill="#303c36" font-family="Segoe UI,Arial,sans-serif" font-size="22" >DEĞİŞEN SU</text><text x="930" y="452" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Düşük −6,6 m → yüksek −5,6 m.</text><text x="930" y="479" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >1 m artış × 40 m² = 40 m³.</text><text x="930" y="506" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Dolum hızı kaynak debisine bağlı.</text><text x="78" y="570" fill="#303c36" font-family="Segoe UI,Arial,sans-serif" font-size="20" >A–A / uzun eksen</text><rect x="190" y="721.9" width="110" height="143.10000000000002" fill="url(#hatch)" stroke="#303c36" stroke-width="2"/><rect x="724" y="727.2" width="110" height="137.79999999999995" fill="url(#hatch)" stroke="#303c36" stroke-width="2"/><rect x="300" y="865" width="424" height="20" fill="url(#hatch)" stroke="#303c36" stroke-width="2"/><rect x="300" y="737.8" width="424" height="127.20000000000005" fill="#a0c8cb" stroke="none" stroke-width="2"/><path d="M300 790.8L724 790.8" fill="none" stroke-width="2" stroke="#386b78" stroke-dasharray="8 5"/><path d="M190 600L834 600" fill="none" stroke="#303c36" stroke-width="15"/><path d="M190 600L190 721.9" fill="none" stroke="#303c36" stroke-width="2" /><path d="M834 600L834 727.2" fill="none" stroke="#303c36" stroke-width="2" /><text x="345" y="724.8" fill="#386b78" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Yüksek su −5,6 m</text><text x="345" y="814.8" fill="#386b78" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Düşük su −6,6 m</text><text x="435" y="908" fill="#303c36" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Taban −8 m</text><path d="M864 737.8L864 727.2" fill="none" stroke-width="2" stroke="#626d60"/><path d="M858 737.8L870 737.8" fill="none" stroke="#303c36" stroke-width="2" /><path d="M858 727.2L870 727.2" fill="none" stroke="#303c36" stroke-width="2" /><text x="881" y="732.5" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="16" text-anchor="start">20 cm</text><text x="1030" y="675" fill="#303c36" font-family="Segoe UI,Arial,sans-serif" font-size="22" >GÜVENLİ DÖNÜŞ</text><text x="1030" y="707" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Giriş yüksek suda 30 cm kuru kalır.</text><text x="1030" y="734" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Baş üstünde en az 2,3 m kapı boşluğu.</text><text x="1030" y="761" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Alt tahliye suyu düşürür; kontrol erişilir.</text><text x="1030" y="788" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Savak bağlantısı üretim adayıdır.</text></svg>