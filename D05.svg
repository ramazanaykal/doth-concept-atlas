<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(35)"><path d="M0 0V10" stroke="#b4b6a7" stroke-width="1"/></pattern><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#9b663a" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="1000" fill="#ece8dc" stroke="none" stroke-width="2"/><text x="58" y="43" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2">DWELLING ON THE HILL / MİMARİ TASARIM ÖNERİSİ</text><text x="58" y="94" fill="#303c36" font-family="Segoe UI,Arial,sans-serif" font-size="35" >D05  04 · Kuru galeri</text><text x="58" y="130" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="18" >Plan + A–A hacim kesiti. Aynı kaya, daha yüksek tek boşluk; mimari sabit kalır.</text><path d="M58 153L1542 153" fill="none" stroke="#303c36" stroke-width="2" /><path d="M58 940L1542 940" fill="none" stroke="#303c36" stroke-width="2" /><text x="58" y="972" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="14" >21 EKİM 2026 · Ölçüler tasarım önerisi; arazi, kazı veya Unreal uygulaması ölçümü değildir.</text><text x="1542" y="972" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="14" text-anchor="end">D05</text><polyline points="630,560 480,560 430,460 290,460 290,340 140,340 140,230" fill="none" stroke="#303c36" stroke-width="23" stroke-linejoin="round" /><polyline points="630,560 480,560 430,460 290,460 290,340 140,340 140,230" fill="none" stroke="#ece8dc" stroke-width="19" stroke-linejoin="round" /><ellipse cx="430" cy="510" rx="90" ry="60" fill="#ece8dc" stroke="#303c36" stroke-width="3"/><polyline points="630,560 480,560 430,460 290,460 290,340 140,340 140,230" fill="none" stroke="#9b663a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr)"/><circle cx="630" cy="560" r="16" fill="#303c36"/><text x="630" y="566" fill="#ece8dc" font-family="Segoe UI,Arial,sans-serif" font-size="17" text-anchor="middle">G</text><circle cx="140" cy="230" r="16" fill="#303c36"/><text x="140" y="236" fill="#ece8dc" font-family="Segoe UI,Arial,sans-serif" font-size="17" text-anchor="middle">K1</text><polyline points="140,230 140,190" fill="none" stroke="#7d4938" stroke-width="3" stroke-linejoin="round" stroke-dasharray="8 5"/><text x="160" y="200" fill="#7d4938" font-family="Segoe UI,Arial,sans-serif" font-size="16" >K1 → hazne,30 m</text><text x="460" y="500" fill="#303c36" font-family="Segoe UI,Arial,sans-serif" font-size="18" >12×18 m</text><text x="460" y="530" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="15" >doğal boşluk</text><text x="480" y="600" fill="#303c36" font-family="Segoe UI,Arial,sans-serif" font-size="16" >Giriş / kuru sırt −11 m</text><text x="835" y="220" fill="#303c36" font-family="Segoe UI,Arial,sans-serif" font-size="22" >GEÇİŞ</text><text x="835" y="252" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Su bölümünden çıkış kuru sırttır.</text><text x="835" y="279" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Önce 6–8 m tavan açılır.</text><text x="835" y="306" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Sonra alçak kaya geçidine dönülür.</text><text x="835" y="333" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >K1 yalnız bu taraftan açılır.</text><text x="835" y="380" fill="#303c36" font-family="Segoe UI,Arial,sans-serif" font-size="22" >YANLIŞ İŞARET</text><text x="835" y="412" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Tebeşir değişir; kaya omzu değişmez.</text><text x="835" y="439" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Yanlış yön kısa bir doğal cebe gider.</text><text x="835" y="466" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Yeni labirent veya hareket eden duvar yok.</text><text x="79" y="650" fill="#303c36" font-family="Segoe UI,Arial,sans-serif" font-size="20" >A–A / doğal hacim; yatay ve düşey aynı ölçek</text><path d="M235 872L721 872" fill="none" stroke="#303c36" stroke-width="4"/><polyline points="235,801.8 305.2,801.8 364.6,683 564.4,683 640,801.8 721,801.8" fill="none" stroke="#303c36" stroke-width="4" stroke-linejoin="round" /><path d="M478 683L478 872" fill="none" stroke-width="2" stroke="#626d60"/><path d="M484 683L472 683" fill="none" stroke="#303c36" stroke-width="2" /><path d="M484 872L472 872" fill="none" stroke="#303c36" stroke-width="2" /><text x="495" y="777.5" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="16" text-anchor="start">7 m hedef</text><path d="M235 905L721 905" fill="none" stroke-width="2" stroke="#626d60"/><path d="M235 899L235 911" fill="none" stroke="#303c36" stroke-width="2" /><path d="M721 899L721 911" fill="none" stroke="#303c36" stroke-width="2" /><text x="478" y="895" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle">18 m ana hacim ekseni</text><text x="960" y="730" fill="#303c36" font-family="Segoe UI,Arial,sans-serif" font-size="22" >Alçak geçit profili</text><text x="960" y="762" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Kuru geçitte 1,9×2,6 m önerisi.</text><text x="960" y="789" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Yüksek hacim ayrı kaya türü gerektirmez.</text></svg>