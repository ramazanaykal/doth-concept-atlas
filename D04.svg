<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(35)"><path d="M0 0V10" stroke="#b4b6a7" stroke-width="1"/></pattern><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6" fill="none" stroke="#9b663a" stroke-width="1"/></marker></defs><rect x="0" y="0" width="1600" height="1000" fill="#ece8dc" stroke="none" stroke-width="2"/><text x="58" y="43" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2">DWELLING ON THE HILL / MİMARİ TASARIM ÖNERİSİ</text><text x="58" y="94" fill="#303c36" font-family="Segoe UI,Arial,sans-serif" font-size="35" >D04  03 · Su basmış yarık</text><text x="58" y="130" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="18" >Plan + iki dalışın yan kesiti.63,2 m rotanın tamamı su altında değildir.</text><path d="M58 153L1542 153" fill="none" stroke="#303c36" stroke-width="2" /><path d="M58 940L1542 940" fill="none" stroke="#303c36" stroke-width="2" /><text x="58" y="972" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="14" >21 EKİM 2026 · Ölçüler tasarım önerisi; arazi, kazı veya Unreal uygulaması ölçümü değildir.</text><text x="1542" y="972" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="14" text-anchor="end">D04</text><polyline points="100,212 122,344 221,399 331,333 441,432 573,322" fill="none" stroke="#303c36" stroke-width="34.8" stroke-linejoin="round" /><polyline points="100,212 122,344 221,399 331,333 441,432 573,322" fill="none" stroke="#ece8dc" stroke-width="30.799999999999997" stroke-linejoin="round" /><polyline points="100,212 122,344 221,399 331,333 441,432 573,322" fill="none" stroke="#9b663a" stroke-width="3" stroke-linejoin="round" marker-end="url(#arr)"/><circle cx="122" cy="344" r="22" fill="#a0c8cb" stroke="#386b78" stroke-width="2"/><text x="122" y="350" fill="#386b78" font-family="Segoe UI,Arial,sans-serif" font-size="17" text-anchor="middle">1</text><circle cx="331" cy="333" r="22" fill="#a0c8cb" stroke="#386b78" stroke-width="2"/><text x="331" y="339" fill="#386b78" font-family="Segoe UI,Arial,sans-serif" font-size="17" text-anchor="middle">2</text><circle cx="534.5" cy="355" r="22" fill="#a0c8cb" stroke="#386b78" stroke-width="2"/><text x="534.5" y="361" fill="#386b78" font-family="Segoe UI,Arial,sans-serif" font-size="17" text-anchor="middle">3</text><text x="74" y="518" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="15" >Plan genel krokiden 90° döndürüldü; açıklıklar aynı ölçekle çizildi.</text><path d="M100 476L210 476" fill="none" stroke-width="2" stroke="#626d60"/><path d="M100 470L100 482" fill="none" stroke="#303c36" stroke-width="2" /><path d="M210 470L210 482" fill="none" stroke="#303c36" stroke-width="2" /><text x="155" y="466" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle">10 m</text><text x="750" y="207" fill="#303c36" font-family="Segoe UI,Arial,sans-serif" font-size="22" >HAREKET AÇIKLIĞI</text><text x="750" y="239" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Düz geçişte 2,5–3 m en / yükseklik önerisi.</text><text x="750" y="266" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Dönüş cebinde yaklaşık 4 m çap.</text><text x="750" y="293" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Bu ölçüler sorunsuz çarpışma kanıtı değil.</text><text x="750" y="354" fill="#303c36" font-family="Segoe UI,Arial,sans-serif" font-size="22" >NEFES</text><text x="750" y="386" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >1 → başlangıç hava cebi.</text><text x="750" y="413" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >2 → ara nefes; ikinci dalışa hazırlan.</text><text x="750" y="440" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >3 → son hava cebi ve kuru rampa.</text><text x="750" y="467" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="17" >Baş su üstünde ve gerçek hava boşluğunda olmalı.</text><text x="76" y="650" fill="#303c36" font-family="Segoe UI,Arial,sans-serif" font-size="19" >A–A / bütün 63,2 m aşama; yatay ve düşey aynı ölçek</text><text x="76" y="681" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="16" >Dalışlar 20–28 m ve 43–51 m aralığında önerildi. Kalan kısım yaklaşım, yüzey ve rampadır.</text><defs><clipPath id="swimvoid"><polygon points="125,764 525,764 525,830 685,830 685,764 985,764 985,830 1145,830 1145,764 1185,764 1389,752 1389,804 1165,884 325,884 125,824"/></clipPath></defs><rect x="125" y="824" width="1264" height="60" fill="#a0c8cb" clip-path="url(#swimvoid)"/><polyline points="125,764 525,764 525,830 685,830 685,764 985,764 985,830 1145,830 1145,764 1185,764 1389,752" fill="none" stroke="#303c36" stroke-width="4" stroke-linejoin="round" /><polyline points="125,824 325,884 1165,884 1389,804" fill="none" stroke="#303c36" stroke-width="4" stroke-linejoin="round" /><text x="135" y="812" fill="#386b78" font-family="Segoe UI,Arial,sans-serif" font-size="16" >Su −12 m</text><text x="365" y="752" fill="#303c36" font-family="Segoe UI,Arial,sans-serif" font-size="16" >1 / HAVA</text><text x="805" y="752" fill="#303c36" font-family="Segoe UI,Arial,sans-serif" font-size="16" >2 / HAVA</text><text x="1205" y="752" fill="#303c36" font-family="Segoe UI,Arial,sans-serif" font-size="16" >3 / HAVA</text><path d="M525 913L685 913" fill="none" stroke-width="2" stroke="#626d60"/><path d="M525 907L525 919" fill="none" stroke="#303c36" stroke-width="2" /><path d="M685 907L685 919" fill="none" stroke="#303c36" stroke-width="2" /><text x="605" y="903" fill="#626d60" font-family="Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle">8 m dalış</text><path d="M985 913L1145 913" fill="none" stroke-width="2" stroke="#626d60"/><p